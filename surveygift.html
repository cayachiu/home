<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewards Form</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; 
            font-family: sans-serif;
        }
        #survey-iframe {
            width: 100%;
            height: 100%;
            border: none; 
        }
        .message-container {
            padding: 20px;
        }
    </style>
    
    <script>
        window.onload = function() {
            var referrer = document.referrer;
            // 允許的來源網域（您的主要問卷網域）
            var allowedDomain = "ojs.lib.ntnu.edu.tw"; 
            
            // 抓取網址參數
            var urlParams = new URLSearchParams(window.location.search);
            var fromParam = urlParams.get('from');
            
            // 這是要嵌在 iframe 裡面的「獎勵表單」網址
            var rewardFormUrl = "https://ojs.lib.ntnu.edu.tw/survey/index.php/743732?newtest=Y"; 

            // 雙重驗證：來源網址符合 OR 網址帶有 ?from=survey 參數
            if ((referrer && referrer.indexOf(allowedDomain) !== -1) || fromParam === "survey") {
                // 驗證通過 -> 顯示獎勵表單
                document.body.innerHTML = '<iframe id="survey-iframe" src="' + rewardFormUrl + '" title="Rewards Form">載入中 (Loading)...</iframe>';
            } else {
                // 驗證失敗 -> 封鎖
                document.body.innerHTML = '<div class="message-container"><h1>拒絕存取 Access Denied</h1><p>您必須完成問卷才能進入此表單。 You must complete the survey to access this rewards form.</p></div>';
            }
        };
    </script>
</head>
<body>
    <div class="message-container">
        <p>正在驗證問卷完成狀態，請稍候... (Verifying status, please wait...)</p>
    </div>
</body>
</html>
